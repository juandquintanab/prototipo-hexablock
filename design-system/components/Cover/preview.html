<!doctype html>
<html><head><meta charset="utf-8"><title>Cover</title>
<style>
html,body{margin:0}
.cv{position:relative;width:960px;height:288px;background:var(--sky);overflow:hidden;font-family:var(--font-display);font-variation-settings:'SOFT' 100}
.slab{fill:var(--wood-500)} .slab-lip{fill:var(--wood-700)}
.sun{fill:var(--sun-400)} .sun-lip{fill:var(--sun-600)}
.merge{fill:var(--game-merge)} .merge-lip{fill:var(--game-merge)}
.fit{fill:var(--game-fit)} .fit-lip{fill:var(--game-fit)}
.sort{fill:var(--game-sort)} .sort-lip{fill:var(--game-sort)}
.wood{fill:var(--wood-500)} .wood-lip{fill:var(--wood-700)}
.shade{fill:var(--shade)}
.name{position:absolute;left:40px;bottom:58px;max-width:440px;margin:0;font-size:84px;line-height:.95;font-weight:400;color:var(--ink)}
.tag{position:absolute;left:42px;bottom:28px;max-width:440px;margin:0;font-size:14px;font-weight:600;color:var(--ink)}
</style></head>
