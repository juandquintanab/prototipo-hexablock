<!doctype html>
<html><head><meta charset="utf-8"><title>Icons</title></head>
<body style="margin:0">
<div class="hx" style="padding:16px"><div class="hx-ground hx-ground--panel" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:14px" id="g"></div></div>
<script>
var H = window.HexaBlock, g = document.getElementById('g');
H.icons.forEach(function (n) { g.insertAdjacentHTML('beforeend', '<div class="hx-col" style="gap:6px;color:var(--wood-700)">' + H.icon(n, 30) + '<span class="hx-label" style="letter-spacing:0;text-transform:none">' + n + '</span></div>'); });
</script>
</body></html>
