<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings</title></head>
<body style="margin:0">
<div class="hx" style="padding:16px">

<div class="hx-ground hx-ground--panel" style="max-width:380px;margin:auto">
 <div class="hx-setting"><span id="i1">Sonido</span><button class="hx-toggle" role="switch" aria-checked="true" aria-label="Sonido"></button></div>
 <div class="hx-setting"><span id="i2">Música</span><button class="hx-toggle" role="switch" aria-checked="false" aria-label="Música"></button></div>
 <div class="hx-setting"><span id="i3">Idioma</span><div class="hx-pills"><button class="hx-pill" aria-pressed="true">ES</button><button class="hx-pill" aria-pressed="false">EN</button></div></div>
 <div class="hx-setting"><span id="i4">Figuras</span><button class="hx-btn hx-btn--secondary" style="min-width:0;padding:10px 18px;min-height:40px;font-size:16px">Catálogo</button></div>
</div>
</div>
<script>
var H = window.HexaBlock;

[['i1','sound'],['i2','music'],['i3','globe'],['i4','shapes']].forEach(function(x){var e=document.getElementById(x[0]);e.innerHTML=H.icon(x[1],22)+e.textContent;});
document.querySelectorAll('.hx-toggle').forEach(function(t){t.onclick=function(){t.setAttribute('aria-checked',t.getAttribute('aria-checked')==='true'?'false':'true');};});
document.querySelectorAll('.hx-pill').forEach(function(p){p.onclick=function(){document.querySelectorAll('.hx-pill').forEach(function(q){q.setAttribute('aria-pressed',q===p);});};});
</script>
</body></html>
