<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LevelTile</title></head>
<body style="margin:0">
<div class="hx" style="padding:16px">

<div class="hx-ground hx-ground--panel hx-row" style="justify-content:center" id="r"></div>
</div>
<script>
var H = window.HexaBlock;

var r=document.getElementById('r');
[[1,3],[2,2],[3,1],[4,'cur'],[5,'lock'],[6,'lock']].forEach(function(l){
 var lock=l[1]==='lock',cur=l[1]==='cur',col=lock?'disabled':cur?'sun-400':'game-fit';
 var hex=H.shape({sides:6,size:72,color:col,depth:7});
 var stars=typeof l[1]==='number'?'<div class="hx-stars">'+H.star(l[1]>0,16)+H.star(l[1]>1,18)+H.star(l[1]>2,16)+'</div>':'<div style="height:22px"></div>';
 r.insertAdjacentHTML('beforeend','<button class="hx-level'+(lock?' is-locked':'')+(cur?' is-current':'')+'" aria-label="Nivel '+l[0]+'"><div class="hx-level__hex">'+hex+'<span class="hx-level__num">'+(lock?H.icon('lock',26):l[0])+'</span></div>'+stars+'</button>');});
</script>
</body></html>
