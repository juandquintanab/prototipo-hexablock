<!doctype html>
<html><head><meta charset="utf-8"><title>Effects</title></head>
<body style="margin:0">
<div class="hx" style="padding:16px;display:grid;gap:14px;justify-items:center">
  <div class="hx-screen hx-screen--lines" id="stage" style="width:320px;height:400px;display:grid;place-items:center;padding:0"></div>
  <div class="hx-row" style="justify-content:center;gap:8px" id="b"></div>
</div>
<script>
var H = window.HexaBlock, st = document.getElementById('stage');
st.innerHTML = H.scene('lines') + '<div id="bd" style="width:240px">' + H.board({ size: 2, cell: 22, base: true, faces: true, fill: function (c, i) { return c.r === 0 ? H.PIECES[(i + 2) % 8] : (i % 4 === 0 ? H.PIECES[i % 8] : null); } }) + '</div>';
function line() {
  var svg = st.querySelector('svg.hx-board'), box = st.getBoundingClientRect();
  [].forEach.call(svg.querySelectorAll('.hx-piece'), function (g, i) {
    if (g.dataset.key.split(',')[1] !== '0') return;
    var b = g.getBoundingClientRect(); setTimeout(function () { H.burst(st, b.left - box.left + b.width / 2, b.top - box.top + b.height / 2, null, 8); g.style.opacity = 0; }, i * 40);
  });
  H.floatText(st, 160, 150, '+120'); H.combo(st, '¡Doble!'); H.shake(st, 5);
  setTimeout(function () { svg.querySelectorAll('.hx-piece').forEach(function (g) { g.style.opacity = 1; }); }, 1400);
}
var B = [['Línea + combo', line], ['Puntos', function () { H.floatText(st, 100 + Math.random() * 120, 220, '+' + (10 + Math.round(Math.random() * 90))); }],
  ['Combo', function () { H.combo(st, '¡Triple!'); }], ['Sacudida', function () { H.shake(st, 7); }], ['Confeti', function () { H.confetti(st, 80); }]];
B.forEach(function (x) { var e = document.createElement('button'); e.className = 'hx-btn hx-btn--secondary'; e.style.cssText = 'min-width:0;min-height:40px;padding:9px 14px;font-size:15px'; e.textContent = x[0]; e.onclick = x[1]; document.getElementById('b').appendChild(e); });
setTimeout(line, 600);
</script>
</body></html>
