<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mascot</title></head>
<body style="margin:0">
<div class="hx" style="padding:16px">

<div class="hx-ground hx-ground--sky hx-row" style="justify-content:center;gap:22px" id="moods"></div>
<div class="hx-ground hx-ground--panel hx-row" style="justify-content:center;gap:6px;margin-top:16px" id="shapes"></div>
</div>
<script>
var H = window.HexaBlock;

var m=document.getElementById('moods');
[['feliz','Feliz · mapa y menús'],['celebra','Celebra · victoria'],['sorpresa','Sorpresa · combo'],['triste','Triste · derrota']].forEach(function(x){m.insertAdjacentHTML('beforeend','<div class="hx-col">'+H.mascot({mood:x[0],size:104})+'<div class="hx-label" style="color:var(--ink)">'+x[1]+'</div></div>');});
var s=document.getElementById('shapes');for(var n=3;n<=10;n++) s.insertAdjacentHTML('beforeend',H.mascot({sides:n,size:72,color:['piece-red','piece-orange','sun-400','piece-green','piece-teal','piece-blue','piece-purple','piece-pink'][n-3]}));
document.querySelectorAll('.hx-mascot').forEach(function(e){e.classList.add('is-alive');});
</script>
</body></html>
